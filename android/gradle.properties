# ---------------------------------------------------------------------------
# Global Gradle settings for the RepRise Android build.
# ---------------------------------------------------------------------------

# Memory for the Gradle daemon / Kotlin compiler. 2 GB is plenty for this app.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build modules and tasks in parallel where possible.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is the modern support library (required for Jetpack Compose).
android.useAndroidX=true

# Only generate the R class for the module that declares a resource (faster builds).
android.nonTransitiveRClass=true

# Official Kotlin formatting style for generated code.
kotlin.code.style=official
