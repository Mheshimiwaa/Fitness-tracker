# ---------------------------------------------------------------------------
# Gradle Version Catalog
#
# This file is the SINGLE place where dependency versions are declared.
# In build.gradle.kts we reference them as `libs.plugins.xxx` / `libs.xxx`,
# which keeps versions consistent across modules and avoids typos.
#
# Versions chosen are the current stable releases (October 2026).
# ---------------------------------------------------------------------------

[versions]
agp = "9.4.1"
# AGP 9 has BUILT-IN Kotlin support: it ships the Kotlin Gradle Plugin itself,
# so we do NOT apply `org.jetbrains.kotlin.android` any more. AGP 9.4.1 bundles
# KGP 2.2.10, and the Compose/serialization plugins must match that version.
kotlin = "2.2.10"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
coroutines = "1.11.0"

# Phase 1 only uses material-icons-core for a handful of standard icons.
# The library is frozen at 1.7.8 upstream, so we pin it explicitly instead of
# relying on the Compose BOM.
materialIconsCore = "1.7.8"

# Networking / storage (wired into the build in later phases).
retrofit = "3.0.0"
okhttp = "5.5.0"
kotlinxSerialization = "1.11.0"
datastore = "1.2.1"
securityCrypto = "1.1.0"
# Background work (the gym reminder). WorkManager rather than an exact alarm:
# a reminder may legitimately be a few minutes late, and it must survive a
# reboot — which WorkManager does for free, without an exact-alarm permission.
work = "2.12.0"
# Image loading (profile photos). Coil is the standard Compose image loader: it
# handles fetching, caching and decoding, which is the part that is easy to get
# subtly wrong by hand. The `network-okhttp` artifact lets it use OkHttp, the
# HTTP client the app already ships.
#
# Pinned to 3.3.0 on purpose. Coil 3.5.0 and 3.6.3 are compiled with Kotlin 2.4
# and depend on kotlin-stdlib 2.4.x, whose metadata the Kotlin compiler bundled
# with AGP 9.4.1 (2.2.x) refuses to read — it can read up to 2.3.0. 3.3.0 is
# built with Kotlin 2.2, so the whole build stays on ONE Kotlin version. (The
# alternative, forcing an older stdlib in, would risk a NoSuchMethodError on a
# device instead of a build error here.)
coil = "3.3.0"

# Testing
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
# --- Core / lifecycle -------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# --- Compose (versions come from the BOM) -----------------------------------
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "materialIconsCore" }

# --- Navigation -------------------------------------------------------------
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# --- Coroutines -------------------------------------------------------------
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# --- Networking (used from Phase 2 onward) ----------------------------------
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# --- Local storage (used from Phase 2 onward) -------------------------------
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# --- Background work (Phase 7: the gym reminder) ----------------------------
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# --- Images (Phase 7: profile photos) ---------------------------------------
# `coil-compose` gives the AsyncImage composables; `coil-network-okhttp` gives
# Coil an OkHttp-backed network layer so it reuses the HTTP stack the app
# already carries instead of pulling in another one.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# --- Testing ----------------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
